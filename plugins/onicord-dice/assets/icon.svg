<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="diceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="faceLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="faceRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="#18181b" />
  <rect width="128" height="128" rx="28" fill="url(#diceBg)" opacity="0.15" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#diceBg)" stroke-width="2" opacity="0.4" />

  <!-- Isometric 3D Die -->
  <g transform="translate(64, 62) scale(0.95)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 0 -36 L 34 -18 L 0 0 L -34 -18 Z" fill="url(#faceTop)" stroke="#e9d5ff" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Pip on Top Face -->
    <circle cx="0" cy="-18" r="4" fill="#ffffff" />
    <circle cx="-16" cy="-26" r="3" fill="#ffffff" />
    <circle cx="16" cy="-10" r="3" fill="#ffffff" />

    <!-- Left Face -->
    <path d="M -34 -18 L 0 0 L 0 38 L -34 20 Z" fill="url(#faceLeft)" stroke="#a855f7" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Pips on Left Face -->
    <circle cx="-17" cy="10" r="3.5" fill="#e9d5ff" />
    <circle cx="-25" cy="1" r="3" fill="#e9d5ff" />
    <circle cx="-9" cy="19" r="3" fill="#e9d5ff" />
    <circle cx="-25" cy="19" r="3" fill="#e9d5ff" />
    <circle cx="-9" cy="1" r="3" fill="#e9d5ff" />

    <!-- Right Face -->
    <path d="M 0 0 L 34 -18 L 34 20 L 0 38 Z" fill="url(#faceRight)" stroke="#c084fc" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Pips on Right Face -->
    <circle cx="17" cy="10" r="4" fill="#ffffff" />
    <circle cx="9" cy="22" r="3.5" fill="#ffffff" />
    <circle cx="25" cy="-2" r="3.5" fill="#ffffff" />
  </g>
</svg>
